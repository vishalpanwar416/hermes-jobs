<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Jobs</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --panel-2: #1c2029;
    --line: #262b36;
    --text: #e5e8ee;
    --dim: #8b93a3;
    --ok: #3fb950;
    --err: #f85149;
    --warn: #d29922;
    --accent: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --panel-2: #f0f2f5; --line: #dfe3e9;
      --text: #1b1f27; --dim: #6b7280; --accent: #0969da;
      --ok: #1a7f37; --err: #cf222e; --warn: #9a6700;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  input[type=search] {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 9px; font-size: 13px; width: 200px;
  }
  label.toggle { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }

  main { flex: 1; display: grid; grid-template-columns: 290px 320px 1fr; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; } }

  .col { min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; }
  .colhead {
    position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 7px 12px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .6px; color: var(--dim); z-index: 1;
  }

  .row {
    padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: flex; gap: 8px; align-items: baseline;
  }
  .row:hover { background: var(--panel-2); }
  .row.sel { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
  .row .name { font-weight: 500; flex: 1; word-break: break-word; }
  .row .meta { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 6px; }
  .dot.ok { background: var(--ok); }
  .dot.error { background: var(--err); }
  .dot.idle { background: var(--dim); opacity: .5; }
  .dot.running { background: var(--warn); }
  .sub { color: var(--dim); font-size: 12px; padding: 0 12px 8px 27px; margin-top: -6px; }
  .sub.err { color: var(--err); font-family: var(--mono); word-break: break-word; }
  .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--dim);
  }
  .paused { opacity: .5; }

  pre#log {
    margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .empty { color: var(--dim); padding: 24px 16px; font-style: italic; }
  .bar {
    position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 7px 12px; display: flex; gap: 10px; align-items: center;
    font-size: 12px; color: var(--dim); font-family: var(--mono); z-index: 1;
  }
  .bar .spacer { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>Hermes Jobs</h1>
  <input type="search" id="filter" placeholder="filter jobs…" autocomplete="off">
  <label class="toggle"><input type="checkbox" id="failedOnly"> failed only</label>
  <span class="spacer"></span>
  <span id="summary" class="meta" style="color:var(--dim);font-size:12px"></span>
  <button id="refresh">Refresh</button>
</header>

<main>
  <div class="col" id="jobsCol"><div class="colhead">Jobs</div><div id="jobs"></div></div>
  <div class="col" id="runsCol"><div class="colhead">Runs</div><div id="runs"><div class="empty">Pick a job.</div></div></div>
  <div class="col" id="logCol"><div class="bar" id="logbar"><span>Log</span></div><pre id="log"><div class="empty">Pick a run.</div></pre></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let JOBS = [], ORPHANS = [], selJob = null, selRun = null;

const fmt = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso).slice(0, 19).replace("T", " ");
  return d.toLocaleString(undefined,
    { month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" });
};
const dur = (s) => s == null ? "" : s < 60 ? `${s}s` : `${Math.floor(s / 60)}m${Math.round(s % 60)}s`;
const esc = (s) => (s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

async function loadJobs() {
  const d = await get("/api/jobs");
  JOBS = d.jobs; ORPHANS = d.orphan_pipelines;
  const bad = JOBS.filter((j) => j.last_status === "error").length;
  $("summary").textContent = `${JOBS.length} jobs · ${bad} failing`;
  renderJobs();
}

function renderJobs() {
  const q = $("filter").value.toLowerCase();
  const failedOnly = $("failedOnly").checked;
  const list = JOBS.filter((j) =>
    (!q || j.name.toLowerCase().includes(q)) &&
    (!failedOnly || j.last_status === "error"));

  let html = list.map((j) => {
    const state = !j.enabled ? "idle" : j.last_status === "error" ? "error"
      : j.last_status === "ok" ? "ok" : "idle";
    // A delivery failure still leaves last_status ok — the job ran, the message
    // never arrived — so it gets its own line rather than changing the dot.
    const note = j.last_status === "error" && j.last_error
      ? `<div class="sub err">${esc(j.last_error.slice(0, 200))}</div>`
      : j.last_delivery_error
        ? `<div class="sub err">delivery: ${esc(j.last_delivery_error.slice(0, 160))}</div>` : "";
    return `<div class="row ${selJob === j.name ? "sel" : ""} ${j.enabled ? "" : "paused"}" data-job="${esc(j.name)}">
        <span class="dot ${state}"></span>
        <span class="name">${esc(j.name)}
          <div class="meta">${esc(j.schedule)} · ${j.mode}${j.enabled ? "" : " · paused"}</div>
        </span>
        <span class="meta">${fmt(j.last_run_at)}</span>
      </div>${note}`;
  }).join("");

  if (ORPHANS.length && !failedOnly) {
    const orph = ORPHANS.filter((p) => !q || p.toLowerCase().includes(q));
    if (orph.length) {
      html += `<div class="colhead" style="position:static">Pipelines without a job</div>` +
        orph.map((p) => `<div class="row ${selJob === p ? "sel" : ""}" data-job="${esc(p)}">
            <span class="dot idle"></span><span class="name">${esc(p)}
            <div class="meta">logs only</div></span></div>`).join("");
    }
  }
  $("jobs").innerHTML = html || `<div class="empty">No jobs match.</div>`;
  $("jobs").querySelectorAll("[data-job]").forEach((el) =>
    el.onclick = () => selectJob(el.dataset.job));
}

async function selectJob(name) {
  selJob = name; selRun = null; renderJobs();
  $("runs").innerHTML = `<div class="empty">Loading…</div>`;
  $("log").innerHTML = `<div class="empty">Pick a run.</div>`;
  let d;
  try { d = await get(`/api/runs?job=${encodeURIComponent(name)}`); }
  catch (e) { $("runs").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  if (!d.runs.length) {
    $("runs").innerHTML = `<div class="empty">No runs recorded yet.</div>`;
    return;
  }
  $("runs").innerHTML = d.runs.map((r, i) => {
    const state = r.status === "failed" ? "error" : r.status === "completed" ? "ok"
      : r.status === "running" || r.status === "claimed" ? "running" : "idle";
    const label = r.kind === "execution" ? (r.status || "execution")
      : r.kind === "log" ? "script log" : "agent output";
    const size = r.size ? `${(r.size / 1024).toFixed(1)}KB` : "";
    const err = r.error ? `<div class="sub err">${esc(r.error.slice(0, 200))}</div>` : "";
    return `<div class="row" data-i="${i}">
        <span class="dot ${state}"></span>
        <span class="name">${fmt(r.started_at)}
          <div class="meta"><span class="tag">${label}</span> ${dur(r.duration_s)} ${size}</div>
        </span></div>${err}`;
  }).join("");

  $("runs").querySelectorAll("[data-i]").forEach((el) =>
    el.onclick = () => showRun(d.runs[+el.dataset.i], el));
}

async function showRun(run, el) {
  $("runs").querySelectorAll(".row").forEach((r) => r.classList.remove("sel"));
  el.classList.add("sel");

  if (run.kind === "execution") {
    // An execution row is scheduler bookkeeping, not output; the text lives in
    // the sibling log or output entry, so show what the row itself knows.
    $("logbar").innerHTML = `<span>execution ${esc(run.id)}</span>`;
    $("log").textContent =
      `status:      ${run.status}\nsource:      ${run.source}\n` +
      `started:     ${run.started_at || "—"}\nfinished:    ${run.finished_at || "—"}\n` +
      `duration:    ${dur(run.duration_s) || "—"}\n\n${run.error || "(no error recorded)"}`;
    return;
  }

  $("logbar").innerHTML = `<span>${esc(run.path)}</span>`;
  $("log").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const d = await get(`/api/content?kind=${run.kind}&path=${encodeURIComponent(run.path)}`);
    $("log").textContent = d.content || "(empty file)";
    $("logbar").innerHTML =
      `<span>${esc(run.path)}</span><span class="spacer"></span><span>${(d.size / 1024).toFixed(1)}KB</span>`;
  } catch (e) {
    $("log").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

$("filter").oninput = renderJobs;
$("failedOnly").onchange = renderJobs;
$("refresh").onclick = () => { loadJobs(); if (selJob) selectJob(selJob); };
loadJobs();
</script>
</body>
</html>
